<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com"
    />
    <title>Context Bridge Hub</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;600&display=swap');
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-primary: #0a0a0b;
        --bg-secondary: #141416;
        --accent-green: #00ff87;
        --accent-green-dim: rgba(0, 255, 135, 0.15);
        --text-primary: #ffffff;
        --text-secondary: #71717a;
        --border: #27272a;
      }

      body {
        font-family: 'Space Grotesk', -apple-system, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        -webkit-app-region: drag;
        user-select: none;
      }

      .container {
        text-align: center;
        padding: 2rem;
      }

      .status-ring {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: var(--accent-green-dim);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        position: relative;
        animation: pulse 2s ease-in-out infinite;
      }

      .status-ring::before {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid var(--accent-green);
        animation: ring-pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      @keyframes ring-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .status-dot {
        width: 24px;
        height: 24px;
        background: var(--accent-green);
        border-radius: 50%;
        box-shadow: 0 0 20px var(--accent-green);
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        letter-spacing: -0.02em;
      }

      .subtitle {
        color: var(--text-secondary);
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
      }

      .port-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.875rem;
      }

      .port-badge span {
        color: var(--accent-green);
      }

      .endpoints {
        margin-top: 1.5rem;
        display: flex;
        gap: 0.5rem;
        justify-content: center;
      }

      .endpoint {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        color: var(--text-secondary);
        background: var(--bg-secondary);
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="status-ring">
        <div class="status-dot"></div>
      </div>
      <h1>Context Bridge Active</h1>
      <p class="subtitle">Desktop Hub is running</p>
      <div class="port-badge">
        localhost:<span>3124</span>
      </div>
      <div class="endpoints">
        <span class="endpoint">/health</span>
        <span class="endpoint">/context</span>
      </div>
    </div>
  </body>
</html>
